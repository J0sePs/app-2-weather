# Nginx del frontend: sirve la SPA y hace de proxy inverso de la API.
#
# El objetivo es que el navegador use un único origen. La SPA pide a `/api/...`
# y Nginx lo reenvía a `backend:8000`, de modo que el backend no necesita
# permitir ningún origen CORS para el despliegue real.

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # `1m` deja margen a un pronóstico lento sin retener conexiones indefinidamente.
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ---- API ----
    # Sin barra final en `proxy_pass`: la ruta `/api/...` se reenvía tal cual, y
    # por eso la aplicación usa `${API_BASE_URL}/prediction` con base `/api`.
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
    }

    # ---- SPA ----
    # Cualquier ruta que no sea un archivo real se resuelve a `index.html`, para
    # que recargar en una ruta del enrutado del cliente no devuelva un 404.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # El `index.html` nunca se cachea: si no, un despliegue nuevo dejaría el
    # bundle anterior referenciado desde la caché del navegador.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Los bundles llevan hash en el nombre, así que se pueden cachear para siempre.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Detrás de un proxy inverso externo conviene no anunciar la versión.
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
